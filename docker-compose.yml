services:
  ide:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${IDE_PORT:-8866}:${IDE_PORT:-8866}"
    environment:
      DATA_DIR: "/data"
      HOST_DATA_DIR: ${HOST_DATA_DIR:?set HOST_DATA_DIR to an absolute host path}
      WEB_DIR: "/app/frontend/dist"
      IDE_CONFIG: "/data/IDE.config"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
