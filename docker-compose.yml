services:
  ide:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8866:8866"
    environment:
      PORT: "8866"
      DATA_DIR: "/data"
      HOST_DATA_DIR: ${HOST_DATA_DIR:?set HOST_DATA_DIR to an absolute host path}
      WEB_DIR: "/app/frontend/dist"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
